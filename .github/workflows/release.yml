name: Release

# Each MCP server is versioned and released independently. Push a tag named
# <server>-v<version> (e.g. msbuild-mcp-v0.2.0) after merging a change that sets that
# server's <Version> and adds a "## [<version>]" section to its CHANGELOG.md. Push tags one
# at a time: GitHub starts no runs when more than three tags are pushed at once.
# Manual runs on a branch build prerelease packages (<version>-ci.<run>) as a workflow
# artifact without a release; a manual run on a release tag releases that tag (recovery for
# a tag push that did not start a run).

on:
  push:
    tags:
      - '*-mcp-v*'
  workflow_dispatch:
    inputs:
      server:
        description: Server to pack
        type: choice
        default: all
        options:
          - all
          - ci-debug-mcp
          - elicit-mcp
          - hyperv-mcp
          - msbuild-mcp

permissions:
  contents: read

env:
  PACKAGE_DIR: artifacts/packages
  NOTES_PATH: artifacts/release-notes.md

jobs:
  pack:
    runs-on: windows-latest
    outputs:
      servers: ${{ steps.resolve.outputs.servers }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Resolve servers and versions
        id: resolve
        shell: pwsh
        env:
          SERVER: ${{ inputs.server }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $servers = @(./scripts/Get-ReleaseInfo.ps1 -Tag $env:GITHUB_REF_NAME -NotesPath $env:NOTES_PATH)
          } else {
            $servers = @(./scripts/Get-ReleaseInfo.ps1 -Component $env:SERVER -PrereleaseSuffix "ci.$env:GITHUB_RUN_NUMBER")
          }
          $servers | Format-Table | Out-String | Write-Host
          "servers=$(ConvertTo-Json -InputObject $servers -Compress)" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build --verbosity normal

      - name: Pack
        shell: pwsh
        env:
          SERVERS: ${{ steps.resolve.outputs.servers }}
        run: |
          foreach ($server in $env:SERVERS | ConvertFrom-Json) {
            dotnet pack $server.Project -c Release -o $env:PACKAGE_DIR -p:Version=$($server.Version)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Smoke test packages (win-x64)
        shell: pwsh
        env:
          SERVERS: ${{ steps.resolve.outputs.servers }}
        run: |
          $ids = @($env:SERVERS | ConvertFrom-Json | ForEach-Object PackageId)
          ./scripts/Test-ToolPackage.ps1 -PackageDirectory $env:PACKAGE_DIR -RuntimeIdentifier win-x64 -PackageId $ids

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: ${{ env.PACKAGE_DIR }}/*.nupkg
          if-no-files-found: error

      - name: Upload release notes
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ env.NOTES_PATH }}
          if-no-files-found: error

  smoke-test-arm64:
    needs: pack
    runs-on: windows-11-arm

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ${{ env.PACKAGE_DIR }}

      - name: Smoke test packages (win-arm64)
        shell: pwsh
        env:
          SERVERS: ${{ needs.pack.outputs.servers }}
        run: |
          $ids = @($env:SERVERS | ConvertFrom-Json | ForEach-Object PackageId)
          ./scripts/Test-ToolPackage.ps1 -PackageDirectory $env:PACKAGE_DIR -RuntimeIdentifier win-arm64 -PackageId $ids

  release:
    if: github.ref_type == 'tag'
    needs: [pack, smoke-test-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          name: nuget-packages
          path: ${{ env.PACKAGE_DIR }}

      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: artifacts

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SERVERS: ${{ needs.pack.outputs.servers }}
        run: |
          $server = @($env:SERVERS | ConvertFrom-Json)[0]
          $prerelease = if ($server.Version.Contains('-')) { @('--prerelease') } else { @() }
          gh release create $env:GITHUB_REF_NAME (Get-ChildItem "$env:PACKAGE_DIR/*.nupkg").FullName `
            --repo $env:GITHUB_REPOSITORY --verify-tag `
            --title "$($server.Component) $($server.Version)" `
            --notes-file $env:NOTES_PATH @prerelease
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
