name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c ${{ matrix.configuration }} --warnaserror

      - name: Test
        run: dotnet test --no-build -c ${{ matrix.configuration }} --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Pack and smoke test tool packages (win-x64)
        if: matrix.configuration == 'Release'
        shell: pwsh
        run: |
          $servers = @(./scripts/Get-ReleaseInfo.ps1)
          foreach ($server in $servers) {
            dotnet pack $server.Project -c Release -o artifacts/packages
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ./scripts/Test-ToolPackage.ps1 -PackageDirectory artifacts/packages -RuntimeIdentifier win-x64 -PackageId $servers.PackageId

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.configuration }}
          path: '**/test-results.trx'

  # Runs the suite on an ARM64 host. The MsBuildMcp tests that start real builds use the native
  # ARM64 Visual Studio tools there (MSBuild.exe and the vcvarsall environment), and the win-arm64
  # tool packages are smoke-tested natively.
  build-and-test-arm64:
    runs-on: windows-11-arm

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release --warnaserror

      - name: Test
        run: dotnet test --no-build -c Release --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Pack and smoke test tool packages (win-arm64)
        shell: pwsh
        run: |
          $servers = @(./scripts/Get-ReleaseInfo.ps1)
          foreach ($server in $servers) {
            dotnet pack $server.Project -c Release -o artifacts/packages
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          ./scripts/Test-ToolPackage.ps1 -PackageDirectory artifacts/packages -RuntimeIdentifier win-arm64 -PackageId $servers.PackageId

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-arm64
          path: '**/test-results.trx'
